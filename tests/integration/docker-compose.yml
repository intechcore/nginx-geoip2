services:
  nginx:
    image: ${IMAGE_NAME:-nginx-geoip2}:${IMAGE_TAG:-latest}
    container_name: nginx-integration-test
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Generate self-signed certificate for testing
        mkdir -p /etc/nginx/certs
        openssl req -x509 -newkey rsa:2048 -keyout /etc/nginx/certs/test.key \
          -out /etc/nginx/certs/test.pem -days 1 -nodes \
          -subj "/CN=test.example.com" \
          -addext "subjectAltName=DNS:app.test.example.com,DNS:svn.test.example.com,DNS:git.test.example.com" \
          2>/dev/null
        # Start nginx
        exec nginx -g "daemon off;"
    ports:
      - "${NGINX_TEST_HTTP_PORT:-18080}:80"
      - "${NGINX_TEST_HTTPS_PORT:-18443}:443"
    volumes:
      - ./fixtures/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fixtures/conf.d/rate-limits.nginx:/etc/nginx/conf.d/rate-limits.nginx:ro
      - ./fixtures/conf.d/80to443.nginx:/etc/nginx/conf.d/80to443.nginx:ro
      - ./fixtures/conf.d/maps:/etc/nginx/conf.d/maps:ro
      - ./fixtures/conf.d/includes:/etc/nginx/conf.d/includes:ro
      - ./fixtures/conf.d/test-services:/etc/nginx/conf.d/test-services:ro
      - ${GEOIP_DB:-./fixtures/GeoLite2-Country.mmdb}:/usr/share/GeoIP/GeoLite2-Country.mmdb:ro
    depends_on:
      - backend

  backend:
    image: python:3-alpine
    container_name: nginx-integration-backend
    working_dir: /app
    command: ["python", "server.py"]
    volumes:
      - ./fixtures/backend:/app:ro
