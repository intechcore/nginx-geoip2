load_module /usr/lib/nginx/modules/ngx_http_geoip2_module.so;

worker_processes        auto;

error_log               /dev/stderr warn;
pid                     /tmp/nginx.pid;

events {
    worker_connections    4096;
}

http {
    include /etc/nginx/conf.d/maps/*.map.nginx;
    include /etc/nginx/conf.d/includes/geoip2.nginx;

    # Test fixture only: trust X-Test-IP from any source (Docker Desktop on macOS
    # forwards host traffic so nginx may see the host's public IP, which would
    # otherwise not match any set_real_ip_from range and X-Test-IP would be
    # ignored). Tests that need "private network" semantics must send X-Test-IP
    # explicitly (e.g. 10.0.0.5). DO NOT copy this to production.
    set_real_ip_from  0.0.0.0/0;
    real_ip_header    X-Test-IP;

    # Default value for variables used in logging (overridden in server blocks)
    map $uri $is_allowed { default '-'; }

    include               /etc/nginx/mime.types;
    default_type          application/octet-stream;

    # Console log format (timestamps added by entrypoint FIFO filter)
    log_format geoip      '[access] $host $remote_addr $geoip2_data_country_code '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

    access_log            /dev/stdout geoip;

    sendfile              on;

    keepalive_timeout     65;

    include               /etc/nginx/conf.d/*.nginx;
    include               /etc/nginx/conf.d/test-services/*.nginx;
}
