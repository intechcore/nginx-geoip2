sonar.projectKey=intechcore_nginx-geoip2
sonar.organization=intechcore
sonar.projectName=nginx-geoip2

sonar.sources=.
sonar.exclusions=**/*.mmdb

# Written by the sonar job in .github/workflows/ci.yml, see tests/coverage.sh.
# No test runs the tests themselves, the host helper update_geoip_db.sh or the
# CI helpers.
sonar.coverageReportPaths=build/coverage.xml
sonar.coverage.exclusions=tests/**,update_geoip_db.sh,.github/**
