name: Rebuild

# Once a week, checks the published image of each nginx branch and releases a
# new build where the base image, its packages or the GeoIP2 module changed.
# The checks are in rebuild-branch.yml.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch:
    strategy:
      fail-fast: false
      matrix:
        branch: [mainline, stable]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/rebuild-branch.yml
    with:
      branch: ${{ matrix.branch }}
