name: Release

on:
  workflow_dispatch:
  # Called by rebuild.yml when the base image or its packages changed.
  workflow_call:
    inputs:
      reason:
        description: Why the image is rebuilt, goes into the release notes
        type: string
        default: ''
      no_cache:
        description: Build without the layer cache, to refresh the apt packages
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # renovate: nginx
  NGINX_VERSION: '1.31.6'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve base image digest
        id: base
        run: |
          digest=$(docker buildx imagetools inspect "nginx:${NGINX_VERSION}-trixie" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Base image digest: $digest"

      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nginx-geoip:test
          build-args: |
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            BASE_DIGEST=${{ steps.base.outputs.digest }}
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha

      - name: Run tests
        run: ./tests/integration/test-integration.sh nginx-geoip:test

      - name: Determine version
        id: version
        run: |
          NGINX_VERSION="${{ env.NGINX_VERSION }}"
          echo "nginx_version=$NGINX_VERSION"

          # Get existing tags from registry
          EXISTING_TAGS=$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions" \
            --paginate --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")

          # Find next available suffix
          SUFFIX=1
          while echo "$EXISTING_TAGS" | grep -qx "${NGINX_VERSION}-${SUFFIX}"; do
            SUFFIX=$((SUFFIX + 1))
          done

          IMAGE_TAG="${NGINX_VERSION}-${SUFFIX}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "nginx_version=$NGINX_VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected version: $IMAGE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.nginx_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NGINX_VERSION=${{ steps.version.outputs.nginx_version }}
            BASE_DIGEST=${{ steps.base.outputs.digest }}
          no-cache: ${{ inputs.no_cache == true }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        run: |
          git tag "v${{ steps.version.outputs.image_tag }}"
          git push origin "v${{ steps.version.outputs.image_tag }}"

      - name: Generate release notes
        env:
          REASON: ${{ inputs.reason }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
          fi
          if [ -n "$REASON" ]; then
            printf '\n\n## Rebuild\n\n%s\n' "$REASON" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.image_tag }}
          body_path: release_notes.md
          generate_release_notes: false
