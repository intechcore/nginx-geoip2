name: Release

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # renovate: nginx
  NGINX_VERSION: '1.31.2'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build image for testing
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          load: true
          tags: nginx-geoip:test
          build-args: |
            NGINX_VERSION=${{ env.NGINX_VERSION }}
          cache-from: type=gha

      - name: Run tests
        run: ./tests/integration/test-integration.sh nginx-geoip:test

      - name: Determine version
        id: version
        run: |
          NGINX_VERSION="${{ env.NGINX_VERSION }}"
          echo "nginx_version=$NGINX_VERSION"

          # Get existing tags from registry
          EXISTING_TAGS=$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions" \
            --paginate --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")

          # Find next available suffix
          SUFFIX=1
          while echo "$EXISTING_TAGS" | grep -qx "${NGINX_VERSION}-${SUFFIX}"; do
            SUFFIX=$((SUFFIX + 1))
          done

          IMAGE_TAG="${NGINX_VERSION}-${SUFFIX}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "nginx_version=$NGINX_VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected version: $IMAGE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.nginx_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NGINX_VERSION=${{ steps.version.outputs.nginx_version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        run: |
          git tag "v${{ steps.version.outputs.image_tag }}"
          git push origin "v${{ steps.version.outputs.image_tag }}"

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.image_tag }}
          body_path: release_notes.md
          generate_release_notes: false
