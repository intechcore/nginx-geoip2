name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: nginx branch to release
        type: choice
        options: [mainline, stable]
        default: mainline
  # Called by rebuild.yml when the base image, its packages or the module changed.
  workflow_call:
    inputs:
      branch:
        description: nginx branch to release, mainline or stable
        type: string
        required: true
      reason:
        description: Why the image is rebuilt, goes into the release notes
        type: string
        default: ''
      no_cache:
        description: Build without the layer cache, to refresh the apt packages
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BRANCH: ${{ inputs.branch }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read the branch versions
        id: branch
        run: .github/scripts/branch-versions.sh "$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Resolve base image digest
        id: base
        env:
          NGINX_VERSION: ${{ steps.branch.outputs.nginx }}
        run: |
          digest=$(docker buildx imagetools inspect "nginx:${NGINX_VERSION}-trixie" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Base image digest: $digest"

      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nginx-geoip:test
          build-args: |
            NGINX_VERSION=${{ steps.branch.outputs.nginx }}
            GEOIP2_MODULE=${{ steps.branch.outputs.module }}
            BASE_DIGEST=${{ steps.base.outputs.digest }}
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha,scope=${{ inputs.branch }}-linux/amd64

      - name: Run tests
        run: |
          ./tests/integration/test-integration.sh nginx-geoip:test
          ./tests/logrotate/test-logrotate.sh nginx-geoip:test
          ./tests/uptimerobot/test-uptimerobot.sh nginx-geoip:test

      - name: Determine version
        id: version
        run: |
          echo "nginx_version=$NGINX_VERSION"

          # Get existing tags from registry
          EXISTING_TAGS=$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions" \
            --paginate --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")

          # Find next available suffix
          SUFFIX=1
          while echo "$EXISTING_TAGS" | grep -qx "${NGINX_VERSION}-${SUFFIX}"; do
            SUFFIX=$((SUFFIX + 1))
          done

          IMAGE_TAG="${NGINX_VERSION}-${SUFFIX}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "nginx_version=$NGINX_VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected version: $IMAGE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NGINX_VERSION: ${{ steps.branch.outputs.nginx }}

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # latest follows mainline, as the nginx image does.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.nginx_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.branch }}
            ${{ inputs.branch == 'mainline' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          build-args: |
            NGINX_VERSION=${{ steps.version.outputs.nginx_version }}
            GEOIP2_MODULE=${{ steps.branch.outputs.module }}
            BASE_DIGEST=${{ steps.base.outputs.digest }}
          no-cache: ${{ inputs.no_cache == true }}
          provenance: false
          cache-from: type=gha,scope=${{ inputs.branch }}-linux/amd64

      # gh creates the tag through the API, so the checkout keeps no
      # credentials. The notes list the commits since the previous release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.image_tag }}
          REASON: ${{ inputs.reason }}
          NGINX_VERSION: ${{ steps.version.outputs.nginx_version }}
          LATEST: ${{ inputs.branch == 'mainline' }}
        run: |
          # The previous release of the same branch: same major.minor.
          series="${NGINX_VERSION%.*}"
          PREV_TAG=$(git tag --sort=-version:refname | grep "^v${series}\." | head -1)
          if [ -n "$PREV_TAG" ]; then
            {
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
            } > release_notes.md
          else
            echo "## Initial Release" > release_notes.md
          fi
          if [ -n "$REASON" ]; then
            printf '\n\n## Rebuild\n\n%s\n' "$REASON" >> release_notes.md
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release_notes.md \
            --latest="$LATEST"
