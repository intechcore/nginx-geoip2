name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'Nginx version'
        required: false
        # renovate: nginx
        default: '1.29.5'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Determine Nginx version
        id: nginx
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.nginx_version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Extract nginx version from tag (v1.28.2 -> 1.28.2, v1.28.2-2 -> 1.28.2)
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            NGINX_VERSION="${TAG_VERSION%%-*}"
            echo "version=${NGINX_VERSION}" >> $GITHUB_OUTPUT
          else
            # renovate: nginx
            echo "version=1.29.5" >> $GITHUB_OUTPUT
          fi

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nginx-geoip:test
          build-args: |
            NGINX_VERSION=${{ steps.nginx.outputs.version }}
          cache-from: type=gha

      - name: Run smoke tests
        run: ./tests/test-image.sh nginx-geoip:test

      - name: Run integration tests
        run: ./tests/integration/test-integration.sh nginx-geoip:test

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NGINX_VERSION=${{ steps.nginx.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
