name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Both nginx branches on both architectures. The versions come from
  # nginx-branches.env.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [mainline, stable]
        platform: [linux/amd64, linux/arm64]
    name: Build and Test (${{ matrix.branch }}, ${{ matrix.platform }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read the branch versions
        id: branch
        run: .github/scripts/branch-versions.sh "${{ matrix.branch }}" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nginx-geoip:test
          platforms: ${{ matrix.platform }}
          build-args: |
            NGINX_VERSION=${{ steps.branch.outputs.nginx }}
            GEOIP2_MODULE=${{ steps.branch.outputs.module }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.branch }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.branch }}-${{ matrix.platform }}

      - name: Run integration tests
        run: ./tests/integration/test-integration.sh nginx-geoip:test

      - name: Run logrotate tests
        run: ./tests/logrotate/test-logrotate.sh nginx-geoip:test

      - name: Run UptimeRobot tests
        run: ./tests/uptimerobot/test-uptimerobot.sh nginx-geoip:test
