name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # renovate: nginx
  NGINX_VERSION: '1.31.6'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    name: Build and Test (${{ matrix.platform }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build metadata
        id: meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image for testing
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: nginx-geoip:test
          platforms: ${{ matrix.platform }}
          build-args: |
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Run integration tests
        run: ./tests/integration/test-integration.sh nginx-geoip:test

      - name: Run logrotate tests
        run: ./tests/logrotate/test-logrotate.sh nginx-geoip:test

      - name: Run UptimeRobot tests
        run: ./tests/uptimerobot/test-uptimerobot.sh nginx-geoip:test
